name: Publish package

on:
  workflow_dispatch:
  release:
    types: [ 'created' ]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install --legacy-peer-deps

      - run: npm publish --access public
